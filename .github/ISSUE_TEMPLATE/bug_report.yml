name: Bug report
description: Something is broken or behaving incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include real personal data** — no real phone numbers,
        names, addresses, or credentials. Use synthetic examples.

        For security vulnerabilities, do **not** use this form. See
        [SECURITY.md](../blob/HEAD/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apps/web
        - services/api
        - services/llm
        - services/ussd
        - services/sms
        - services/telegram
        - services/whatsapp
        - services/whisper
        - vendor/crucix
        - infra
        - docs / other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste logs or errors. Redact anything sensitive.
      render: shell

  - type: checkboxes
    id: confirms
    attributes:
      label: Before submitting
      options:
        - label: I have removed all real personal data and credentials from this report.
          required: true
        - label: I have checked `docs/backlog.md` for an existing entry.
          required: false
